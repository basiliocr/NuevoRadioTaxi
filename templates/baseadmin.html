<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Taxi Express - Admin{% endblock %}</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

  <!-- Estilo personalizado -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/baseadmin.css') }}">

  <!-- Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
</head>
<body>

  <!-- Navbar superior Admin -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4">
    <a class="navbar-brand fw-bold" href="{{ url_for('admin.dashboard_admin') }}">
      <i class="fas fa-user-shield text-info me-2"></i>Taxi Express Admin
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAdmin">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="navbarAdmin">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'admin.ver_solicitudes_admin' %}active{% endif %}" href="{{ url_for('admin.ver_solicitudes_admin') }}">Solicitudes</a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'admin.ver_viajes_admin' %}active{% endif %}" href="{{ url_for('admin.ver_viajes_admin') }}">Viajes</a>
        </li>
        <!-- Más enlaces administrativos en el futuro -->
      </ul>
      <ul class="navbar-nav d-flex">
        <li class="nav-item">
          <a class="nav-link text-danger" href="{{ url_for('auth.logout') }}">
            <i class="fas fa-sign-out-alt me-1"></i>Salir
          </a>
        </li>
      </ul>
    </div>
  </nav>

  <!-- Contenido principal -->
  <main class="container py-4">
    {% with messages = get_flashed_messages(with_categories=True) %}
    {% if messages %}
    <div class="flash-messages mb-3">
      {% for category, message in messages %}
      <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
<script>
  setTimeout(() => {
    const flashes = document.querySelectorAll('.flash-messages .alert');
    flashes.forEach(flash => flash.remove());
  }, 3000);
</script>
