{% extends "baseadmin.html" %}
{% block title %}Crear Usuario{% endblock %}
<div class="container mt-5">
    <div class="card shadow-sm">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Crear Nuevo Usuario</h4>
            <a href="{{ url_for('admin.ver_usuarios_admin') }}" class="btn btn-sm btn-light">
                <i class="fas fa-arrow-left"></i> Volver
            </a>
        </div>
        <div class="card-body">
            <form method="POST" action="{{ url_for('admin.crear_usuario') }}">
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="nombre" class="form-label">Nombre completo</label>
                        <input type="text" class="form-control" id="nombre" name="nombre" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="username" class="form-label">Nombre de usuario</label>
                        <input type="text" class="form-control" id="username" name="username" required>
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="email" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="email" name="email" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="telefono" class="form-label">Teléfono</label>
                        <input type="text" class="form-control" id="telefono" name="telefono">
                    </div>
                </div>

                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="rol_id" class="form-label">Rol</label>
                        <select class="form-select text-dark" id="rol_id" name="rol_id" required>
                            {% for rol in roles %}
                                <option value="{{ rol.id }}">{{ rol.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password" name="password" required>
                    </div>
                </div>

                <div class="d-flex justify-content-end mt-4">
                    <button type="submit" class="btn btn-success">
                        <i class="fas fa-check-circle"></i> Crear Usuario
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
  setTimeout(() => {
    const flashes = document.querySelectorAll('.flash-messages .alert');
    flashes.forEach(flash => flash.remove());
  }, 3000);
</script>
{% endblock %}
