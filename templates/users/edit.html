<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Editar Perfil</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
{% with messages = get_flashed_messages(with_categories=True) %}
  {% if messages %}
    <div class="flash-messages mb-3">
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    </div>
  {% endif %}
{% endwith %}
  <div class="container mt-5">
    <div class="w-50 mx-auto bg-white p-4 rounded shadow-sm border-start border-4 border-warning">
      <h4 class="text-center mb-4">✏️ Editar Perfil</h4>

      <form action="{{ url_for('user.edit', id=user.id) }}" method="POST">
        <div class="mb-3">
          <label class="form-label">Nombre completo</label>
          <input type="text" name="nombre" class="form-control" value="{{ user.nombre }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input type="text" name="username" class="form-control" value="{{ user.username }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Correo electrónico</label>
          <input type="email" name="email" class="form-control" value="{{ user.email }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Teléfono</label>
          <input type="text" name="telefono" class="form-control" value="{{ user.telefono }}">
        </div>

        <div class="d-flex justify-content-end mt-4 gap-2">
          <button type="submit" class="btn btn-warning">💾 Guardar cambios</button>
          <a href="{{ url_for('user.perfil') }}" class="btn btn-secondary">❌ Cancelar</a>
        </div>
      </form>
    </div>
  </div>

</body>
</html>
<script>
  setTimeout(() => {
    const flashes = document.querySelectorAll('.flash-messages .alert');
    flashes.forEach(flash => flash.remove());
  }, 3000);
</script>
