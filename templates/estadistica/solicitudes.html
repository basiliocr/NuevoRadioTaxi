{% extends "baseadmin.html" %}
{% block title %}Estadísticas de Solicitudes{% endblock %}

{% block content %}
<h3 class="mb-4"><i class="fas fa-chart-pie me-2 text-info"></i>Estadísticas de Solicitudes</h3>

<canvas id="graficoTorta" width="400" height="400"></canvas>

{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
  const chartData = {
    labels: {{ data.keys()|list|tojson }},
    datasets: [{
      label: 'Solicitudes por estado',
      data: {{ data.values()|list|tojson }},
      backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545'],
      hoverOffset: 10
    }]
  };

  new Chart(document.getElementById('graficoTorta'), {
    type: 'pie',
    data: chartData,
    options: {
      responsive: true,
      plugins: {
        legend: {
          position: 'bottom'
        }
      }
    }
  });
</script>
{% endblock %}
